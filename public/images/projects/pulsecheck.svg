<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="grafanaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="promGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="grid2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad2)"/>
  <rect width="800" height="450" fill="url(#grid2)"/>

  <!-- Top Bar -->
  <rect x="50" y="40" width="700" height="370" rx="14" fill="#0c111d" fill-opacity="0.7" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="50" y="40" width="700" height="42" rx="14" fill="#111726" fill-opacity="0.9"/>
  <circle cx="75" cy="61" r="5" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="95" cy="61" r="5" fill="#f59e0b" fill-opacity="0.8"/>
  <circle cx="115" cy="61" r="5" fill="#10b981" fill-opacity="0.8"/>
  <text x="145" y="65" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="500">grafana/dashboards/production-cluster-telemetry.json</text>
  <rect x="650" y="52" width="80" height="18" rx="4" fill="#10b981" fill-opacity="0.15"/>
  <text x="662" y="65" fill="#34d399" font-family="monospace" font-size="10">● UP 99.98%</text>

  <!-- Left: Service scraping node -->
  <g transform="translate(80, 115)">
    <rect width="190" height="120" rx="10" fill="#131929" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="18" y="28" fill="#f43f5e" font-family="monospace" font-size="10" font-weight="bold">TARGET DISCOVERY</text>
    <text x="18" y="52" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">Prometheus Server</text>
    <text x="18" y="74" fill="#64748b" font-family="monospace" font-size="11">scrape_interval: 15s</text>
    <text x="18" y="94" fill="#38bdf8" font-family="monospace" font-size="11">active_targets: 18/18</text>
  </g>

  <!-- Right: Metrics Graph Simulation -->
  <g transform="translate(300, 115)">
    <rect width="420" height="120" rx="10" fill="#111624" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="28" fill="#94a3b8" font-family="monospace" font-size="10">RATE(HTTP_REQUESTS_TOTAL[5M])</text>
    <!-- Wave chart -->
    <path d="M 20 95 Q 70 40 120 70 T 220 50 T 320 80 T 400 35 L 400 105 L 20 105 Z" fill="url(#promGrad)"/>
    <path d="M 20 95 Q 70 40 120 70 T 220 50 T 320 80 T 400 35" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <circle cx="400" cy="35" r="4" fill="#38bdf8"/>
    <text x="330" y="28" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">4.2k req/s</text>
  </g>

  <!-- Bottom Left: Alertmanager rules -->
  <g transform="translate(80, 260)">
    <rect width="300" height="120" rx="10" fill="#131929" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="18" y="28" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">ALERTMANAGER PIPELINE</text>
    <text x="18" y="52" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">SLO &amp; Error Budget</text>
    <text x="18" y="74" fill="#94a3b8" font-family="monospace" font-size="11">&gt; HighLatency: p99 &gt; 250ms</text>
    <text x="18" y="94" fill="#10b981" font-family="monospace" font-size="11">Status: OK (0 firing)</text>
  </g>

  <!-- Bottom Right: K8s / Docker container metrics -->
  <g transform="translate(410, 260)">
    <rect width="310" height="120" rx="10" fill="#131929" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="18" y="28" fill="#8b5cf6" font-family="monospace" font-size="10" font-weight="bold">CONTAINER CLUSTER STATS</text>
    <text x="18" y="52" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Kubernetes Pod Resources</text>
    <text x="18" y="74" fill="#94a3b8" font-family="monospace" font-size="11">CPU Utilization: 24.3%</text>
    <text x="18" y="94" fill="#94a3b8" font-family="monospace" font-size="11">Memory Saturation: 41.8%</text>
  </g>
</svg>
