<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e17"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="pcGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="pcViolet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="pcGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#pcBg)"/>
  <rect width="800" height="450" fill="url(#pcGrid)"/>

  <!-- Top Bar -->
  <rect x="40" y="30" width="720" height="390" rx="14" fill="#0c111d" fill-opacity="0.75" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <rect x="40" y="30" width="720" height="40" rx="14" fill="#111726" fill-opacity="0.9"/>
  <circle cx="63" cy="50" r="5" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="81" cy="50" r="5" fill="#f59e0b" fill-opacity="0.8"/>
  <circle cx="99" cy="50" r="5" fill="#10b981" fill-opacity="0.8"/>
  <text x="125" y="54" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">parv166/pulsecheck — Jenkinsfile &amp; Container CI/CD Pipeline</text>
  <rect x="645" y="41" width="95" height="18" rx="4" fill="#f43f5e" fill-opacity="0.15"/>
  <text x="657" y="54" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="10">Jenkins CI</text>

  <!-- Jenkins Pipeline Stages Row -->
  <g transform="translate(60, 95)">
    <!-- Stage 1: Pytest -->
    <rect width="145" height="85" rx="8" fill="#131929" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="12" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">STAGE 1: TEST</text>
    <text x="12" y="44" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">Pytest Unit Suite</text>
    <text x="12" y="62" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Endpoints verification</text>
    <text x="12" y="76" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">✔ /health, /api/demo</text>

    <!-- Arrow 1 -> 2 -->
    <path d="M 145 42 L 175 42" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="175,39 181,42 175,45" fill="#38bdf8"/>

    <!-- Stage 2: Docker Build -->
    <g transform="translate(185, 0)">
      <rect width="150" height="85" rx="8" fill="#131929" stroke="#0ea5e9" stroke-width="1.2"/>
      <text x="12" y="24" fill="#0ea5e9" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">STAGE 2: CONTAINER</text>
      <text x="12" y="44" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">Docker Build</text>
      <text x="12" y="62" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Non-root user (appuser)</text>
      <text x="12" y="76" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">HEALTHCHECK enabled</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 335 42 L 365 42" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="365,39 371,42 365,45" fill="#0ea5e9"/>

    <!-- Stage 3: Trivy Scan -->
    <g transform="translate(375, 0)">
      <rect width="145" height="85" rx="8" fill="#131929" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="12" y="24" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">STAGE 3: SECURITY</text>
      <text x="12" y="44" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">Trivy Vulnerability</text>
      <text x="12" y="62" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">CRITICAL severity gate</text>
      <text x="12" y="76" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="10">JSON report export</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 520 42 L 550 42" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="550,39 556,42 550,45" fill="#f43f5e"/>

    <!-- Stage 4: Publish & Deploy -->
    <g transform="translate(560, 0)">
      <rect width="120" height="85" rx="8" fill="#131929" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="12" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">STAGE 4: CLOUD</text>
      <text x="12" y="44" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="600">Amazon ECR</text>
      <text x="12" y="62" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">&amp; EC2 deployment</text>
      <text x="12" y="76" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10">defined in pipeline</text>
    </g>
  </g>

  <!-- Application Endpoints Details Box -->
  <g transform="translate(60, 210)">
    <rect width="680" height="120" rx="10" fill="#111624" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="28" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">FASTAPI MICROSERVICE ARCHITECTURE</text>

    <!-- Left: Endpoints table -->
    <g transform="translate(20, 42)">
      <text x="0" y="16" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">GET /health</text>
      <text x="130" y="16" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11">→ &#123;&quot;status&quot;: &quot;ok&quot;, &quot;app&quot;: &quot;pulsecheck&quot;&#125;</text>

      <text x="0" y="38" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">GET /version</text>
      <text x="130" y="38" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11">→ &#123;&quot;version&quot;: &quot;1.0.0&quot;&#125;</text>

      <text x="0" y="60" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">GET /api/demo</text>
      <text x="130" y="60" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11">→ Validated response payload</text>
    </g>

    <!-- Right: Container specs -->
    <g transform="translate(480, 42)">
      <rect width="180" height="65" rx="6" fill="#151b2e" stroke="rgba(255,255,255,0.06)"/>
      <text x="12" y="20" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">USER appuser:appgroup</text>
      <text x="12" y="36" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">EXPOSE 8000</text>
      <text x="12" y="52" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="10">✔ Non-root security</text>
    </g>
  </g>

  <!-- Bottom: Security & Implementation Note -->
  <g transform="translate(60, 345)">
    <rect width="680" height="55" rx="8" fill="#111624" stroke="rgba(255,255,255,0.06)"/>
    <text x="16" y="24" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">&gt; Security Gate:</text>
    <text x="120" y="24" fill="#cbd5e1" font-family="sans-serif" font-size="11">Trivy vulnerability scanner gates builds on CRITICAL findings, outputting audit JSON artifacts.</text>
    <text x="16" y="42" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">&gt; Engineering Scope:</text>
    <text x="165" y="42" fill="#94a3b8" font-family="sans-serif" font-size="11">Documented Jenkinsfile declarative pipeline with Docker build, automated unit tests, and security scans.</text>
  </g>
</svg>
