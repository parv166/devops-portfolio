<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- Top Ambient Glow -->
  <circle cx="400" cy="50" r="220" fill="url(#violetGlow)" filter="blur(60px)"/>

  <!-- Architecture Header Box -->
  <rect x="50" y="40" width="700" height="370" rx="14" fill="#0f1422" fill-opacity="0.6" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Top Bar of Architecture Panel -->
  <rect x="50" y="40" width="700" height="42" rx="14" fill="#131929" fill-opacity="0.8"/>
  <circle cx="75" cy="61" r="5" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="95" cy="61" r="5" fill="#f59e0b" fill-opacity="0.8"/>
  <circle cx="115" cy="61" r="5" fill="#10b981" fill-opacity="0.8"/>
  <text x="145" y="65" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="500">architecture/cloudvault-aws-serverless.tf</text>
  <rect x="660" y="52" width="70" height="18" rx="4" fill="#1e293b"/>
  <text x="673" y="65" fill="#38bdf8" font-family="monospace" font-size="10">AWS-v2</text>

  <!-- Node 1: API Gateway / Client Ingestion -->
  <g transform="translate(90, 140)">
    <rect width="160" height="90" rx="10" fill="#151b2e" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="32" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">ENDPOINT</text>
    <text x="20" y="54" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">API Gateway</text>
    <text x="20" y="72" fill="#64748b" font-family="sans-serif" font-size="11">JWT Auth &amp; Rate Limit</text>
  </g>

  <!-- Connect 1 -> 2 -->
  <path d="M 250 185 L 320 185" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="320,181 328,185 320,189" fill="#38bdf8"/>

  <!-- Node 2: AWS Lambda Execution -->
  <g transform="translate(320, 140)">
    <rect width="160" height="90" rx="10" fill="#151b2e" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">SERVERLESS</text>
    <text x="20" y="54" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">AWS Lambda</text>
    <text x="20" y="72" fill="#64748b" font-family="sans-serif" font-size="11">Pre-signed S3 Gen</text>
  </g>

  <!-- Connect 2 -> 3 -->
  <path d="M 480 185 L 550 185" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="550,181 558,185 550,189" fill="#f59e0b"/>

  <!-- Node 3: S3 Storage & KMS -->
  <g transform="translate(550, 140)">
    <rect width="160" height="90" rx="10" fill="#151b2e" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="32" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold">STORAGE</text>
    <text x="20" y="54" fill="#f1f5f9" font-family="sans-serif" font-size="14" font-weight="600">Amazon S3</text>
    <text x="20" y="72" fill="#64748b" font-family="sans-serif" font-size="11">KMS Encrypted Vault</text>
  </g>

  <!-- Bottom Node: CloudWatch / Terraform IaC Bar -->
  <g transform="translate(90, 275)">
    <rect width="620" height="95" rx="10" fill="#111624" stroke="rgba(255,255,255,0.08)"/>
    <text x="25" y="35" fill="#818cf8" font-family="monospace" font-size="12" font-weight="600">&gt; terraform apply -auto-approve</text>
    <text x="25" y="60" fill="#94a3b8" font-family="monospace" font-size="11">Apply complete! Resources: 14 added, 0 changed, 0 destroyed.</text>
    <rect x="25" y="72" width="570" height="6" rx="3" fill="#1e293b"/>
    <rect x="25" y="72" width="480" height="6" rx="3" fill="url(#cyanGlow)"/>
  </g>

  <!-- Connect from Lambda to Terraform / Telemetry -->
  <path d="M 400 230 L 400 275" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="3 3"/>
</svg>
