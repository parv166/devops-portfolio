<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#07090e"/>
    </linearGradient>
    <linearGradient id="cvCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cvViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="cvGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#cvBg)"/>
  <rect width="800" height="450" fill="url(#cvGrid)"/>
  <circle cx="400" cy="50" r="220" fill="url(#cvViolet)" filter="blur(60px)"/>

  <!-- Architecture Panel Box -->
  <rect x="40" y="30" width="720" height="390" rx="14" fill="#0f1422" fill-opacity="0.7" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Top Bar -->
  <rect x="40" y="30" width="720" height="40" rx="14" fill="#131929" fill-opacity="0.9"/>
  <circle cx="63" cy="50" r="5" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="81" cy="50" r="5" fill="#f59e0b" fill-opacity="0.8"/>
  <circle cx="99" cy="50" r="5" fill="#10b981" fill-opacity="0.8"/>
  <text x="125" y="54" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">parv166/CloudVault-AWS-Serverless — Architecture Blueprint</text>
  <rect x="655" y="41" width="85" height="18" rx="4" fill="#06b6d4" fill-opacity="0.15"/>
  <text x="668" y="54" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">Terraform</text>

  <!-- Row 1: Frontend & Cognito Auth -->
  <g transform="translate(65, 95)">
    <!-- Frontend -->
    <rect width="180" height="80" rx="8" fill="#141a2c" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="14" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">FRONTEND CLIENT</text>
    <text x="14" y="44" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">React + Vite</text>
    <text x="14" y="62" fill="#94a3b8" font-family="sans-serif" font-size="11">CloudFront + S3 Hosting</text>

    <!-- Arrow to Cognito -->
    <path d="M 180 40 L 235 40" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="235,37 241,40 235,43" fill="#a855f7"/>

    <!-- Cognito -->
    <g transform="translate(245, 0)">
      <rect width="190" height="80" rx="8" fill="#141a2c" stroke="#a855f7" stroke-width="1.2"/>
      <text x="14" y="24" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">IDENTITY &amp; AUTH</text>
      <text x="14" y="44" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Amazon Cognito</text>
      <text x="14" y="62" fill="#94a3b8" font-family="sans-serif" font-size="11">JWT Token &amp; User Pool</text>
    </g>

    <!-- Arrow to API Gateway -->
    <path d="M 435 40 L 490 40" stroke="#f59e0b" stroke-width="1.5"/>
    <polygon points="490,37 496,40 490,43" fill="#f59e0b"/>

    <!-- API Gateway -->
    <g transform="translate(500, 0)">
      <rect width="170" height="80" rx="8" fill="#141a2c" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="14" y="24" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">HTTP API GATEWAY</text>
      <text x="14" y="44" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">API Gateway</text>
      <text x="14" y="62" fill="#94a3b8" font-family="sans-serif" font-size="11">JWT Authorizer Routes</text>
    </g>
  </g>

  <!-- Connect API Gateway down to Lambda -->
  <path d="M 650 175 L 650 215 L 430 215" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <polygon points="430,212 424,215 430,218" fill="#f59e0b"/>

  <!-- Row 2: Serverless Compute & Storage -->
  <g transform="translate(65, 230)">
    <!-- Lambda -->
    <rect width="210" height="85" rx="8" fill="#141a2c" stroke="#f97316" stroke-width="1.2"/>
    <text x="14" y="24" fill="#f97316" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">SERVERLESS COMPUTE</text>
    <text x="14" y="44" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">AWS Lambda (Python)</text>
    <text x="14" y="62" fill="#94a3b8" font-family="sans-serif" font-size="11">Per-User File Ownership Checks</text>

    <!-- Arrow from Lambda to S3 -->
    <path d="M 210 30 L 260 30" stroke="#10b981" stroke-width="1.5"/>
    <polygon points="260,27 266,30 260,33" fill="#10b981"/>

    <!-- Private S3 -->
    <g transform="translate(270, 0)">
      <rect width="180" height="85" rx="8" fill="#141a2c" stroke="#10b981" stroke-width="1.2"/>
      <text x="14" y="24" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">OBJECT STORAGE</text>
      <text x="14" y="44" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">Amazon S3</text>
      <text x="14" y="62" fill="#94a3b8" font-family="sans-serif" font-size="11">Private Bucket (No Public)</text>
    </g>

    <!-- Arrow from Lambda to DynamoDB -->
    <path d="M 210 60 L 475 60 L 475 30 L 490 30" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <polygon points="490,27 496,30 490,33" fill="#38bdf8"/>

    <!-- DynamoDB -->
    <g transform="translate(500, 0)">
      <rect width="170" height="85" rx="8" fill="#141a2c" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="14" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">METADATA DATABASE</text>
      <text x="14" y="44" fill="#f1f5f9" font-family="sans-serif" font-size="13" font-weight="600">DynamoDB</text>
      <text x="14" y="62" fill="#94a3b8" font-family="sans-serif" font-size="11">File Metadata &amp; Size</text>
    </g>
  </g>

  <!-- Bottom: Terraform State & Security footer -->
  <g transform="translate(65, 335)">
    <rect width="670" height="60" rx="8" fill="#111624" stroke="rgba(255,255,255,0.08)"/>
    <text x="20" y="26" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">&gt; Infrastructure as Code: Terraform modules for Cognito, API Gateway, Lambda, S3, &amp; DynamoDB</text>
    <text x="20" y="46" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">Security: JWT Bearer Token validation, scoped IAM execution policies, and zero public S3 bucket access</text>
  </g>
</svg>
